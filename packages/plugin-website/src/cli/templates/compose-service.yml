  # Designed sites: every space switched to a designed site in the admin, picked by the
  # domain a visitor asks for. It only reads{{#if caddy}}; Caddy asks it which domains it knows before
  # issuing a certificate{{/if}}. Form submissions go to `api` over the compose network.
  site:
    <<: [*cms-image, *logging]
    command: ['start', '--config', 'manablox.site.config.ts']
    restart: unless-stopped
    depends_on:
{{#if !sqlite}}
      postgres: { condition: service_healthy }
{{/if}}
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
{{#if !byDomain}}
    ports:
      - '${SITE_PORT:-__SITE_PORT__}:3200'
{{/if}}
    environment:
      <<: *cms-env
{{#if !sqlite}}
      DATABASE_URL: postgres://manablox_public:${POSTGRES_PUBLIC_PASSWORD}@postgres:5432/${POSTGRES_DB:-manablox}
{{/if}}
      # PORT for the image's health check, SITE_PORT for the config.
      PORT: '3200'
      SITE_PORT: '3200'
      SITE_URL: ${SITE_URL:-}
      SITE_EDITOR_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL}
      SITE_CACHE_TTL: ${SITE_CACHE_TTL:-}
      SITE_MEDIA_CACHE_PATH: /data/media-cache
      SITE_FORMS_API_URL: http://api:3000
      SITE_FORMS_SECRET: ${SITE_FORMS_SECRET:-}
      HOST: ${HOST:-}
{{#if sqlite}}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
{{#else}}
      DATABASE_SSL: ${DATABASE_SSL:-}
{{/if}}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-}
      CACHE_SYNC_INTERVAL: ${CACHE_SYNC_INTERVAL:-}
      RATE_LIMIT: ${RATE_LIMIT:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      STORAGE_LOCAL_PUBLIC_URL: ${STORAGE_LOCAL_PUBLIC_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_PRETTY: ${LOG_PRETTY:-}
      LOG_CONSOLE_LEVEL: ${LOG_CONSOLE_LEVEL:-}
      LOG_FILE: ${LOG_FILE:-}
      LOG_FILE_LEVEL: ${LOG_FILE_LEVEL:-}
      LOG_HTTP_URL: ${LOG_HTTP_URL:-}
      LOG_HTTP_HEADERS: ${LOG_HTTP_HEADERS:-}
      LOG_HTTP_BATCH_SIZE: ${LOG_HTTP_BATCH_SIZE:-}
      LOG_HTTP_LEVEL: ${LOG_HTTP_LEVEL:-}
    volumes:
{{#if sqlite}}
      - database:/data/db
{{/if}}
      - uploads:/data/uploads:ro
      - site-media-cache:/data/media-cache
    deploy:
      resources:
        limits:
          memory: 768m
