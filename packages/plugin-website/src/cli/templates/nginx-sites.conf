# Designed sites: every host not named above goes to the site process. nginx cannot fetch
# certificates on demand, so these domains are served over plain http; add a server block
# with a domain's certificate to serve it over https.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://site:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
