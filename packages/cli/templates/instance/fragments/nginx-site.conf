{{#if tls}}
server {
    listen 80;
    server_name ${__DOMAIN_VARIABLE__};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
{{#else}}
server {
    listen 80;
{{/if}}
    server_name ${__DOMAIN_VARIABLE__};
    server_tokens off;
    gzip on;
    gzip_types application/json text/html text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size {{#if admin}}${UPLOAD_BODY_LIMIT}{{#else}}1m{{/if}};

{{#if admin}}
    {{slot nginx.admin}}
{{/if}}
    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live updates are long-lived streams; do not buffer or time them out early.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
