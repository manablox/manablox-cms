# `Connection: upgrade` only for requests that ask for an upgrade.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames are immutable; index.html must never be cached or a deploy
  # leaves clients pinned to a stale bundle.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # The management API: the admin calls it on its own origin. MANAGEMENT_API_URL is an
  # origin without a path, filled in when nginx starts. The API sets caching and size limits.
  location ~ ^/(rpc|api|media|upload|transfer|realtime|plugins)(/|$) {
    proxy_pass ${MANAGEMENT_API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Uploads, imports and the live event stream pass through unbuffered.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Plugin admin bundles and their list.
  location ~ ^/admin/plugins(\.json$|/) {
    proxy_pass ${MANAGEMENT_API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The admin build writes a `.gz` copy next to each text file; the rest is compressed here.
  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
